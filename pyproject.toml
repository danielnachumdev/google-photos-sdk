[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gp_wrapper"
version = "0.9.10"
description = "A Google Photos API wrapper library"
readme = "README.md"
license = { file = "LISENCE" }
authors = [
    { name = "danielnachumdev", email = "danielnachumdev@gmail.com" },
]
keywords = ["functions", "methods", "classes", "API"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.8.0"
# Runtime / publish deps. Install with: uv sync
# moviepy 2.x removed moviepy.editor, which gp_wrapper still imports.
dependencies = [
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "moviepy>=1.0.3,<2",
    "requests",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/danielnachumdev/gp_wrapper"
"Bug Tracker" = "https://github.com/danielnachumdev/gp_wrapper/issues"

# Dev tools (not published). Runtime deps are not duplicated.
# Install with: uv sync --group dev   (or: uv sync --all-groups)
[dependency-groups]
dev = [
    "mypy",
    "pylint",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist",
    "quickpub>=4.1.3",
    "types-requests",
    "types-tqdm",
]

[tool.setuptools.packages.find]
include = ["gp_wrapper*"]
exclude = ["tests*", "archive*"]

[tool.setuptools.package-data]
"gp_wrapper" = ["py.typed"]

# default-groups = [] so `uv sync` is runtime/publish only.
[tool.uv]
default-groups = []
constraint-dependencies = [
    "moviepy>=1.0.3,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=gp_wrapper --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["gp_wrapper"]
omit = [
    "publish.py",
    "tmp.py",
    "*/tests/*",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_empty = true

[tool.mypy]
disallow_untyped_calls = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
namespace_packages = true
explicit_package_bases = true
files = ["gp_wrapper"]
ignore_missing_imports = true

[tool.pylint.main]
ignore = ["tests", "tmp"]

[tool.pylint.basic]
good-names = ["foo", "bar"]
good-names-rgx = "^[a-zA-Z]"
class-rgx = "^(_)?[A-Z][a-zA-Z0-9]*$"
module-rgx = "^[a-zA-Z][a-zA-Z0-9_]*$"

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
    "W0211",
    "C0114",
    "E1120",
    "E0611",
    "W0702",
    "W0612",
    "R0913",
    "C0415",
    "R0912",
    "R0903",
    "R0914",
    "R0911",
    "R1716",
    "W0401",
    "R0801",
    "C0103",
    "R0902",
    "R0401",
]

[tool.pycodestyle]
max-line-length = 120
