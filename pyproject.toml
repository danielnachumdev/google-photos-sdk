[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "google-photos-sdk"
version = "0.9.13"
description = "Python SDK for the Google Photos Library API"
readme = "README.md"
license = { file = "LISENCE" }
authors = [
    { name = "danielnachumdev", email = "danielnachumdev@gmail.com" },
]
keywords = ["google-photos", "sdk", "api", "photos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.11"
# Runtime deps. Install with: uv sync
# moviepy 2.x removed moviepy.editor, which gpsdk still imports.
dependencies = [
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "moviepy>=1.0.3,<3",
    "requests>=2.33.0",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/danielnachumdev/google-photos-sdk"
"Bug Tracker" = "https://github.com/danielnachumdev/google-photos-sdk/issues"

# Dev tools (not published). Runtime deps are not duplicated.
# Install with: uv sync --group dev   (or: uv sync --all-groups)
[dependency-groups]
dev = [
    "mypy",
    "pylint>=4.0.9",
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "pytest-xdist",
    "types-requests",
    "types-tqdm",
]

[tool.setuptools.packages.find]
include = ["gpsdk*"]
exclude = ["tests*", "archive*"]

[tool.setuptools.package-data]
"gpsdk" = ["py.typed"]

# default-groups = [] so `uv sync` is runtime-only.
[tool.uv]
default-groups = []
# Security floors for Dependabot findings (transitive + direct).
constraint-dependencies = [
    "moviepy>=1.0.3,<3",
    "certifi>=2026.10.18",
    "cryptography>=50.0.0",
    "oauthlib>=4.0.0",
    "pillow>=13.0.0",
    "pyasn1>=0.6.5",
    "pygments>=2.20.0",
    "setuptools>=84.1.0",
    "urllib3>=2.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=gpsdk --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["gpsdk"]
omit = [
    "tmp.py",
    "*/tests/*",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_empty = true

[tool.mypy]
disallow_untyped_calls = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
namespace_packages = true
explicit_package_bases = true
files = ["gpsdk"]
ignore_missing_imports = true

[tool.pylint.main]
ignore = ["tests", "tmp"]

[tool.pylint.basic]
good-names = ["foo", "bar"]
good-names-rgx = "^[a-zA-Z]"
class-rgx = "^(_)?[A-Z][a-zA-Z0-9]*$"
module-rgx = "^[a-zA-Z][a-zA-Z0-9_]*$"

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
    "W0211",
    "C0114",
    "E1120",
    "E0611",
    "W0702",
    "W0612",
    "R0913",
    "C0415",
    "R0912",
    "R0903",
    "R0914",
    "R0911",
    "R1716",
    "W0401",
    "R0801",
    "C0103",
    "R0902",
    "R0401",
]

[tool.pycodestyle]
max-line-length = 120
