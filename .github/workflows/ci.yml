name: CI

# Validation only — never creates tags / Releases / wheels.
# Semver / Release publish is CD (cd.yml), gated on this workflow succeeding.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: uv sync --group dev
      - name: Pytest
        run: uv run pytest -q

  # Always-green aggregate so branch protection can require check name "CI".
  ci:
    name: CI
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require test matrix success
        run: |
          set -euo pipefail
          result="${{ needs.test.result }}"
          echo "test matrix: ${result}"
          if [[ "${result}" != "success" ]]; then
            echo "FAIL Tests: ${result}"
            exit 1
          fi
          echo "OK CI"
