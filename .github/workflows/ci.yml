name: CI

# Thin orchestrator — logic in danielnachumdev/actions@v1.
# Prefer requiring check "CI / CI".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: danielnachumdev/actions/.github/workflows/ci.yml@v1
    # with:  # all optional — defaults + auto-detect pyproject.toml
    #   working-directory: .
    #   python-versions: '["3.11","3.12","3.13"]'
    #   sync-args: "--group dev"
    #   pytest-args: "-q"
