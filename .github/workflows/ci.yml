name: CI

# Thin orchestrator — validation only. Logic lives in danielnachumdev/actions@v1.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit
    uses: danielnachumdev/actions/.github/workflows/reusable-python-uv-ci.yml@v1
    with:
      python-versions: '["3.11","3.12","3.13"]'
      sync-args: "--group dev"
      pytest-args: "-q"

  # Aggregate check name "CI" for branch protection / rulesets.
  ci:
    name: CI
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require test matrix success
        run: |
          set -euo pipefail
          result="${{ needs.test.result }}"
          echo "test: ${result}"
          if [[ "${result}" != "success" ]]; then
            echo "FAIL Tests: ${result}"
            exit 1
          fi
          echo "OK CI"
