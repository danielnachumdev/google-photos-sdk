name: CD

# Label gate on PRs; semver GitHub Release after successful CI on main.
# Shared logic: danielnachumdev/actions@v1
# Labels (exactly one): bumpMajor | bumpMinor | bumpPatch | noBump

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve bump only; do not create a Release"
        type: boolean
        default: true
      sha:
        description: "Commit SHA (empty = current GITHUB_SHA)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: cd-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-label:
    name: Release label
    if: github.event_name == 'pull_request'
    uses: danielnachumdev/actions/.github/workflows/reusable-release-label.yml@v1
    with:
      standards-ref: v1

  semver:
    name: semver
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    uses: danielnachumdev/actions/.github/workflows/reusable-semver-github-release.yml@v1
    with:
      standards-ref: v1
      dry-run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
      sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event.inputs.sha != '' && github.event.inputs.sha || github.sha) }}
